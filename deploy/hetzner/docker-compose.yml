# Example Compose for Traefik (+ optional Authentik Forward Auth overlay).
# Adapt Host(), image name, and network to your environment.

services:
  schafkopf:
    image: ${SCHAFKOPF_IMAGE:-ghcr.io/shuitacode/schafkopf:latest}
    container_name: schafkopf
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.schafkopf.rule: Host(`${SCHAFKOPF_HOST:-schafkopf.shui-ta.com}`)
      traefik.http.routers.schafkopf.entrypoints: websecure
      traefik.http.routers.schafkopf.tls.certresolver: letsencrypt
      traefik.http.routers.schafkopf.middlewares: authentik@file,security-headers@file
      traefik.http.services.schafkopf.loadbalancer.server.port: "80"
      # Chrome holt Manifest/Icons ohne Login-Cookie — sonst kein echtes WebAPK/Fullscreen
      traefik.http.routers.schafkopf-pwa.rule: Host(`${SCHAFKOPF_HOST:-schafkopf.shui-ta.com}`) && (Path(`/manifest.webmanifest`) || PathPrefix(`/icons/`) || Path(`/favicon.svg`))
      traefik.http.routers.schafkopf-pwa.entrypoints: websecure
      traefik.http.routers.schafkopf-pwa.tls.certresolver: letsencrypt
      traefik.http.routers.schafkopf-pwa.priority: "200"
      traefik.http.routers.schafkopf-pwa.middlewares: security-headers@file
      traefik.http.routers.schafkopf-pwa.service: schafkopf
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik-public:
    external: true
    name: traefik-public
